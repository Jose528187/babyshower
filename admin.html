<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Reservas · Admin</title>
    <style>
        :root {
            --blue: #78afe2;
            --brown: #996b4d;
            --cream: #fffaf4;
            --ink: #55463d;
            --line: #eadfd5;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--ink);
            font-family: "Trebuchet MS", Arial, sans-serif
        }

        .page {
            max-width: 1200px;
            margin: auto;
            padding: 24px 16px 60px
        }

        h1 {
            font-family: Georgia, serif;
            color: var(--brown);
            font-weight: normal;
            margin: 0 0 4px
        }

        .bar {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            align-items: center;
            margin: 16px 0
        }

        .btn {
            border: 0;
            border-radius: 12px;
            padding: 10px 14px;
            background: var(--blue);
            color: #fff;
            font-weight: bold;
            cursor: pointer
        }

        .btn.brown {
            background: var(--brown)
        }

        .btn.small {
            padding: 6px 10px;
            font-size: 12px;
            background: #c9745f
        }

        input[type=search] {
            flex: 1;
            min-width: 200px;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 13px;
            font-size: 14px
        }

        .muted {
            color: #8a7d74;
            font-size: 13px
        }

        .wrap {
            overflow-x: auto;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px
        }

        th,
        td {
            text-align: left;
            padding: 9px 10px;
            border-bottom: 1px solid var(--line);
            vertical-align: top
        }

        th {
            background: #f8f1ec;
            color: var(--brown);
            white-space: nowrap
        }

        td small {
            color: #8a7d74;
            display: block;
            max-width: 260px;
            overflow-wrap: anywhere
        }

        .hidden {
            display: none !important
        }

        tr.cancelled td {
            opacity: .55
        }

        .badge {
            display: inline-block;
            border-radius: 8px;
            padding: 3px 7px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap
        }

        .badge.ok {
            background: #edf8ef;
            color: #46744e
        }

        .badge.off {
            background: #f0e2d8;
            color: #815a43
        }
    </style>
</head>

<body>
    <div class="page">
        <h1>Reservas del Baby Shower</h1>
        <div class="muted" id="status">Cargando…</div>

        <div class="bar" id="login-bar">
            <button class="btn" id="login">Entrar con Google</button>
        </div>

        <div id="panel" class="hidden">
            <div class="bar">
                <input type="search" id="q" placeholder="Buscar por nombre, regalo, IP…">
                <label class="muted"><input type="checkbox" id="show-cancelled"> Mostrar canceladas</label>
                <button class="btn brown" id="csv">Descargar CSV</button>
                <button class="btn" id="logout" style="background:#aaa">Salir</button>
            </div>
            <div class="wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Regalo</th>
                            <th>Nombre</th>
                            <th>Contacto / Mensaje</th>
                            <th>IP / Ubicación</th>
                            <th>Dispositivo</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { firebaseConfig, ADMIN_EMAILS, FIREBASE_VERSION } from './firebase-config.js';

        const $ = id => document.getElementById(id);
        const status = msg => $('status').textContent = msg;
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        if (firebaseConfig.apiKey.startsWith('TU_')) {
            status('Firebase no está configurado todavía. Completá firebase-config.js (ver README.md).');
            $('login-bar').classList.add('hidden');
            throw new Error('not configured');
        }

        const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;
        const { initializeApp } = await import(`${base}/firebase-app.js`);
        const { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } = await import(`${base}/firebase-auth.js`);
        const { getFirestore, collection, onSnapshot, doc, writeBatch, serverTimestamp } = await import(`${base}/firebase-firestore.js`);

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let reservas = [];
        let cancelaciones = {};
        let unsubs = [];

        $('login').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => status('Error al entrar: ' + e.message));
        $('logout').onclick = () => signOut(auth);
        $('q').oninput = render;
        $('show-cancelled').onchange = render;
        $('csv').onclick = downloadCsv;

        onAuthStateChanged(auth, user => {
            unsubs.forEach(u => u());
            unsubs = [];
            const ok = user && ADMIN_EMAILS.includes(user.email);
            $('login-bar').classList.toggle('hidden', !!user);
            $('panel').classList.toggle('hidden', !ok);
            if (!user) return status('Entrá con la cuenta de Google autorizada.');
            if (!ok) return status(`La cuenta ${user.email} no tiene acceso.`);
            const onErr = e => status('Sin permiso para leer (revisá el email en firestore.rules): ' + e.message);
            unsubs.push(onSnapshot(collection(db, 'reservas_privadas'), snap => {
                reservas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            }, onErr));
            unsubs.push(onSnapshot(collection(db, 'cancelaciones'), snap => {
                cancelaciones = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
                render();
            }, onErr));
        });

        const fmt = ts => ts?.toDate ? ts.toDate().toLocaleString('es-AR') : '';
        const ms = ts => ts?.toMillis ? ts.toMillis() : Date.now();

        function estado(r) {
            const c = cancelaciones[r.id];
            if (!c) return { activa: true, texto: 'Activa' };
            return {
                activa: false,
                texto: c.porAdmin ? `Liberada por admin (${c.adminEmail || ''})` : `Cancelada por invitado${c.desdeMismoDispositivo ? ' (mismo dispositivo)' : ' (con PIN)'}`,
                fecha: fmt(c.fecha),
                ip: c.ip
            };
        }

        function render() {
            const q = $('q').value.toLowerCase();
            const showCancelled = $('show-cancelled').checked;
            const list = reservas
                .map(r => ({ ...r, estado: estado(r) }))
                .filter(r => showCancelled || r.estado.activa)
                .filter(r => JSON.stringify(r).toLowerCase().includes(q))
                .sort((a, b) => ms(b.fecha) - ms(a.fecha));
            const activas = reservas.filter(r => !cancelaciones[r.id]).length;
            status(`${activas} reservas activas · ${reservas.length - activas} canceladas · conectado como ${auth.currentUser?.email}`);
            $('rows').innerHTML = list.map(r => `
                <tr class="${r.estado.activa ? '' : 'cancelled'}">
                    <td>${esc(fmt(r.fecha))}</td>
                    <td><b>${esc(r.regalo)}</b><small>${esc(r.categoria)}</small></td>
                    <td>${esc(r.nombre)}</td>
                    <td>${esc(r.contacto)}<small>${esc(r.mensaje)}</small></td>
                    <td>${esc(r.ip)}<small>${esc([r.ciudad, r.region, r.pais].filter(Boolean).join(', '))}</small><small>${esc(r.proveedor)}</small></td>
                    <td>${esc(r.plataforma)} · ${esc(r.pantalla)}<small>${esc(r.navegador)}</small><small>ID: ${esc(r.dispositivoId)}</small></td>
                    <td><span class="badge ${r.estado.activa ? 'ok' : 'off'}">${esc(r.estado.texto)}</span>
                        ${r.estado.fecha ? `<small>${esc(r.estado.fecha)}${r.estado.ip ? ' · IP ' + esc(r.estado.ip) : ''}</small>` : ''}</td>
                    <td>${r.estado.activa ? `<button class="btn small" data-id="${esc(r.id)}">Liberar</button>` : ''}</td>
                </tr>`).join('');
            $('rows').querySelectorAll('button[data-id]').forEach(b => b.onclick = () => release(b.dataset.id));
        }

        async function release(id) {
            const r = reservas.find(x => x.id === id);
            if (!r || !confirm(`¿Liberar "${r.regalo}" (reservado por ${r.nombre})? Volverá a estar disponible.`)) return;
            const batch = writeBatch(db);
            batch.delete(doc(db, 'reservas', r.regaloId));
            batch.set(doc(db, 'cancelaciones', id), {
                regaloId: r.regaloId, token: r.token, regalo: r.regalo,
                porAdmin: true, adminEmail: auth.currentUser.email, fecha: serverTimestamp()
            });
            await batch.commit().catch(e => alert('No se pudo liberar: ' + e.message));
        }

        function downloadCsv() {
            const cols = ['fecha', 'regalo', 'categoria', 'nombre', 'contacto', 'mensaje', 'estado', 'fechaCancelacion', 'ip', 'ciudad', 'region', 'pais', 'proveedor',
                'dispositivoId', 'plataforma', 'pantalla', 'idioma', 'zonaHoraria', 'navegador', 'referencia'];
            const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
            const value = (r, c) => {
                if (c === 'fecha') return fmt(r.fecha);
                if (c === 'estado') return estado(r).texto;
                if (c === 'fechaCancelacion') return estado(r).fecha;
                return r[c];
            };
            const csv = [cols.join(','), ...reservas.map(r => cols.map(c => cell(value(r, c))).join(','))].join('\n');
            const a = Object.assign(document.createElement('a'), {
                href: URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' })),
                download: 'reservas-baby-shower.csv'
            });
            a.click();
        }
    </script>
</body>

</html>
